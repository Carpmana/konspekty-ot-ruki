name: Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Имя репозитория кончается точкой, а Windows убирает точку в конце имени
    # папки: рабочая папка Actions не создаётся и actions/checkout падает.
    # Поэтому код берём в D:\k и работаем там.
    defaults:
      run:
        working-directory: D:\k
    steps:
      - name: Checkout
        working-directory: D:\
        run: |
          git init -q k
          git -C k remote add origin "https://github.com/${{ github.repository }}"
          git -C k fetch -q --depth 1 origin "${{ github.sha }}"
          git -C k checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Version
        shell: pwsh
        # номер версии для программы: по нему она узнаёт, что вышла новая
        run: Set-Content -Encoding utf8 konspekt/_build.py 'VERSION = "0.2.${{ github.run_number }}"'
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/konspekt.spec
      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KONSPEKT_SMOKE: "1"
        run: |
          $p = Start-Process dist/Konspekt/Konspekt.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Konspekt.exe exited with $($p.ExitCode)" }
      - name: Self-update
        # старая копия сама скачивает новую версию, закрывается и запускается
        # уже обновлённой: с подставного сервера и с настоящего GitHub
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python packaging/check_update.py dist/Konspekt local
          python packaging/check_update.py dist/Konspekt github
      - uses: actions/upload-artifact@v4
        with:
          name: Konspekt-windows
          path: D:\k\dist\Konspekt
      - name: Zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path dist/Konspekt -DestinationPath Konspekt-windows.zip
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Конспекты от руки 0.2.${{ github.run_number }}
          make_latest: "true"
          files: D:/k/Konspekt-windows.zip
          body: |
            **Конспекты от руки** пишут конспект вашим почерком: вставляете текст и печатаете на бумагу или прямо на тетрадный листок. Работает без интернета.

            ### Как установить
            1. Скачайте **Konspekt-windows.zip** (внизу, в разделе Assets).
            2. Распакуйте архив (правой кнопкой → «Извлечь все…»).
            3. Запустите `Konspekt\Konspekt.exe`. Устанавливать ничего не нужно.

            **Если Windows пишет «Система Windows защитила ваш компьютер»**: нажмите «Подробнее», затем «Выполнить в любом случае». Так бывает с любой новой программой без платной цифровой подписи, нужно только при первом запуске.

            При первом запуске программа покажет, как получить свой почерк: распечатать бланк, заполнить ручкой, отсканировать и импортировать. Или нажмите «Попробовать на примере», чтобы сразу посмотреть, как это работает.

            Если программа уже стоит, она сама предложит обновиться.

            Подробное описание со скриншотами: https://github.com/${{ github.repository }}#readme
